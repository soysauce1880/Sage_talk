<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성현 상담톡</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a9bdce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성현톡">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#ddd;display:flex;justify-content:center;height:100vh}
#app{width:100%;max-width:440px;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;background:#b2c7d9;position:relative;overflow:hidden}
header{background:#a9bdce;padding:10px 12px;display:flex;align-items:center;gap:10px}
header button{background:none;border:none;font-size:20px;cursor:pointer;color:#222}
header .title{flex:1;font-weight:600;font-size:16px}
header .title small{color:#555;font-weight:400;margin-left:4px}
#modebar{display:flex;gap:6px;padding:6px 10px;background:#a9bdce;border-top:1px solid #9db2c4;overflow-x:auto}
#modebar button{border:none;border-radius:14px;padding:5px 10px;font-size:12px;background:#fff;cursor:pointer;white-space:nowrap}
#modebar button.add{background:#3c1e1e;color:#fff}
#modebar button.on{background:#3c1e1e;color:#fee500}
#chat{flex:1;overflow-y:auto;padding:10px 10px 16px}
.date{text-align:center;margin:10px 0}
.date span{background:rgba(0,0,0,.15);color:#fff;font-size:11px;padding:4px 12px;border-radius:12px}
.row{display:flex;margin:6px 0;align-items:flex-end;gap:5px}
.row.me{justify-content:flex-end}
.bubble{max-width:72%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.me .bubble{background:#fee500;border-top-right-radius:3px}
.sage{align-items:flex-start}
.avatar{overflow:hidden;width:38px;height:38px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex-shrink:0}
.sage .body{display:flex;flex-direction:column;max-width:78%}
.sage .name{font-size:12px;color:#333;margin-bottom:3px}
.tag{font-size:10px;background:rgba(255,255,255,.6);border-radius:6px;padding:1px 5px;margin-left:4px;color:#555}
.sage .bubble{background:#fff;border-top-left-radius:3px;max-width:100%}
.time{font-size:10px;color:#555;white-space:nowrap}
.typing .bubble{color:#999;letter-spacing:3px}
footer{background:#fff;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px;align-items:flex-end}
textarea{flex:1;border:none;resize:none;font-size:16px;padding:8px;max-height:100px;outline:none;font-family:inherit}
#send{background:#fee500;border:none;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5}
.hint{font-size:11px;color:#888;padding:0 10px 6px;background:#fff}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9}
.modal.show{display:flex}
.card{background:#fff;border-radius:14px;width:88%;max-height:80%;overflow-y:auto;padding:18px}
.card h3{margin-bottom:10px}
.card label{display:block;font-size:13px;margin:10px 0 4px}
.card textarea{width:100%;border:1px solid #ccc;border-radius:6px;font-size:14px;min-height:70px;max-height:none}
.card input,.card select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px}
.card .btns{display:flex;gap:6px;margin-top:14px}
.card .btns button{flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;background:#eee}
.card .btns .pri{background:#fee500;font-weight:600}
.plist div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee;cursor:pointer}
.plist p{font-size:12px;color:#666}
.badge{font-size:11px;padding:3px 8px;border-radius:10px;background:#eee;margin-left:6px}

/* ===== 반응형: 폴드 펼침·태블릿 (600px 이상) ===== */
body{background:#b2c7d9}
#app{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto auto;
  grid-template-areas:"header" "modebar" "chat" "hint" "reply" "footer"}
header{grid-area:header} #modebar{grid-area:modebar} #chat{grid-area:chat;min-height:0} .hint{grid-area:hint} footer{grid-area:footer}
@media (min-width:600px){
  #app{max-width:none;grid-template-columns:minmax(220px,30%) 1fr;grid-template-rows:auto 1fr auto auto auto;
    grid-template-areas:"modebar header" "modebar chat" "modebar hint" "modebar reply" "modebar footer"}
  #modebar{flex-direction:column;overflow-y:auto;overflow-x:hidden;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 10px 12px;
    background:#fff;border-top:none;border-right:1px solid #d5dde5}
  #modebar::before{content:"대화방";font-weight:700;font-size:15px;padding:4px 8px 8px}
  #modebar button{text-align:left;font-size:15px;padding:12px 14px;border-radius:10px;background:transparent}
  #modebar button:hover{background:#f2f4f6}
  #modebar button.on{background:#fff7b8;color:#222;font-weight:600}
  #modebar button.add{background:#3c1e1e;color:#fff;margin-top:6px}
  #backBtn{visibility:hidden}
  #app{padding-top:0} header{padding-top:calc(10px + env(safe-area-inset-top))}
  .bubble{max-width:62%;font-size:15px}
  .sage .body{max-width:66%}
  #chat{padding:14px 24px 20px}
  .card{max-width:520px}
}
.avatar img,.mini{width:100%;height:100%;object-fit:cover}
.mini{width:22px;height:22px;border-radius:8px;vertical-align:middle;margin-right:4px}
#cPrev{width:64px;height:64px;border-radius:20px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
#lock{position:fixed;inset:0;background:#b2c7d9;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock.hide{display:none}
#lock .logo{width:72px;height:72px;border-radius:24px;background:#fee500;display:flex;align-items:center;justify-content:center;font-size:36px}
#lock input{width:180px;text-align:center;font-size:24px;letter-spacing:10px;padding:10px;border:none;border-radius:10px}
#lock button{width:180px;padding:11px;border:none;border-radius:10px;background:#3c1e1e;color:#fee500;font-weight:700;font-size:15px}
#lockMsg{font-size:13px;color:#c0392b;min-height:16px}
.quote{font-size:12px;color:#555;border-left:3px solid rgba(0,0,0,.25);padding:2px 0 2px 7px;margin-bottom:6px;white-space:normal}
.quote b{display:block;font-size:11px}
#replyBar{display:none;background:#f4f4f4;padding:7px 12px;font-size:12px;color:#444;align-items:center;gap:8px;grid-area:reply}
#replyBar.show{display:flex}
#replyBar span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#replyBar button{border:none;background:none;font-size:16px;cursor:pointer}
.bubble{-webkit-user-select:none;user-select:none;cursor:pointer}
.pending .bubble{color:#888;font-style:italic}
</style>
</head>
<body>
<div id="lock"><div class="logo">💬</div><b>성현 상담톡</b>
  <input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
  <button id="pwBtn">입장</button><div id="lockMsg"></div></div>
<div id="app">
  <header>
    <button id="backBtn" title="단톡방으로">‹</button>
    <div class="title" id="roomTitle">성현 단톡방<small id="memberCnt"></small></div>
    <button id="peopleBtn" title="성현 프로필">👥</button>
    <button id="menuBtn" title="설정">☰</button>
  </header>
  <div id="modebar"></div>
  <div id="chat"></div>
  <div class="hint">팁: 말풍선을 길게 누르면 답장할 수 있어요. 괄호 () 안에 상황·감정·배경을 적으면 조언에 반영돼요. 예) 회의 때 말을 못 하겠어요 (신입이고 팀장님이 무서움)</div>
  <div id="replyBar"><span id="replyTxt"></span><button id="replyX">✕</button></div>
  <footer>
    <textarea id="input" rows="1" placeholder="고민을 입력하세요"></textarea>
    <button id="send">전송</button>
  </footer>

  <div class="modal" id="settingsModal"><div class="card">
    <h3>설정</h3>
    <label>AI 제공자</label>
    <select id="provider"><option value="demo">데모 (API 키 없이)</option><option value="anthropic">Anthropic Claude</option><option value="openai">OpenAI</option><option value="gemini">Google Gemini</option></select>
    <label>API 키 (이 브라우저 localStorage에만 저장)</label>
    <input id="apiKey" type="password" placeholder="sk-...">
    <label>모델명</label>
    <select id="model"></select>
    <input id="modelCustom" placeholder="모델명 직접 입력" style="display:none;margin-top:6px">
    <p id="modelNote" style="font-size:11px;color:#888;margin-top:4px"></p>
    <div class="btns"><button class="pri" id="saveSet">저장</button><button id="closeSet">닫기</button></div>
    <div class="btns"><button id="resetChat">현재 대화 초기화</button><button id="wipeAll">모든 대화·키 삭제</button></div>
  </div></div>

  <div class="modal" id="peopleModal"><div class="card">
    <h3>성현·철학자 프로필</h3>
    <div class="plist" id="plist"></div>
    <div class="btns"><button id="closePeople">닫기</button></div>
  </div></div>

  <div class="modal" id="charModal"><div class="card">
    <h3 id="charTitle">새 캐릭터 만들기</h3>
    <label>이름 *</label><input id="cName" placeholder="예) 이안 (소설 'OOO'의 남주)">
    <label>프로필 사진</label>
    <div style="display:flex;gap:10px;align-items:center"><div id="cPrev">👤</div>
      <div style="flex:1"><input id="cImg" type="file" accept="image/*"><button type="button" id="cImgDel" style="margin-top:6px;padding:5px 10px;border:none;border-radius:6px;background:#eee">사진 빼기</button></div></div>
    <label>이모지 (사진이 없을 때 표시)</label><input id="cEmoji" placeholder="🗡️" maxlength="4">
    <label>서사·배경 *</label><textarea id="cStory" placeholder="어떤 세계의 누구인지, 겪은 일, 지금 상황, 비밀 등 자유롭게"></textarea>
    <label>성격·말투</label><textarea id="cStyle" placeholder="예) 무심한 반말, 츤데레, 짧게 끊어 말함, 감정 표현에 서툼"></textarea>
    <label>나와의 관계</label><input id="cRel" placeholder="예) 오래된 소꿉친구 / 처음 만난 사이">
    <label>첫 인사</label><textarea id="cGreet" placeholder="예) ...왜 이제 왔어."></textarea>
    <div class="btns"><button class="pri" id="cSave">저장</button><button id="cCancel">취소</button></div>
  </div></div>

  <div class="modal" id="profileModal"><div class="card" id="profileCard"></div></div>
</div>

<script>
/* ========== 1. 페르소나 데이터 ========== */
const SAGES = {
  laozi:{name:"노자",emoji:"🌊",color:"#cfe8e0",tag:"도가",summary:"무위자연. 억지로 하지 않을 때 일이 저절로 풀린다. 물처럼 낮은 곳으로 흐르되 결국 바위를 뚫는다.",style:"짧고 시적인 문장, 물·바람·골짜기 비유, '~하게나' 같은 느긋한 어조",keys:["번아웃","지침","불안","경쟁","욕심","조급"]},
  confucius:{name:"공자",emoji:"📜",color:"#f2e2c4",tag:"유가",summary:"인(仁)과 예(禮). 관계 속 내 역할을 바르게 하고, 지나침도 모자람도 없는 중용을 지킨다.",style:"점잖고 단정한 어조, '군자는~' 화법, 일상 태도와 예절의 구체적 예시",keys:["인간관계","직장","상사","가족","눈치","예의"]},
  buddha:{name:"부처님",emoji:"🪷",color:"#f6d9c8",tag:"불교",summary:"괴로움의 뿌리는 집착. 마음을 알아차리고 관조하면 괴로움이 옅어진다.",style:"따뜻하고 자비로운 어조, '벗이여', 두 번째 화살·흙탕물 같은 비유",keys:["불안","분노","이별","상실","집착","미움"]},
  zhuangzi:{name:"장자",emoji:"🦋",color:"#e0dcf5",tag:"도가",summary:"나비 꿈. 쓸모없음의 쓸모. 고정관념을 깨면 세상이 훨씬 넓어진다.",style:"해학적이고 장난스러운 어조, 역설과 우화, 큰 새·우물 안 개구리 비유",keys:["비교","눈치","실패","쓸모","진로","고정관념"]},
  socrates:{name:"소크라테스",emoji:"🏛️",color:"#dbe6f3",tag:"그리스",summary:"너 자신을 알라. 질문으로 전제를 검토하며 본질에 다가간다.",style:"차분한 질문을 2~3개 던짐, '자네는 그것을 어떻게 아는가?' 화법",keys:["확신","결정","진로","오해","판단","자존감"]},
  epictetus:{name:"에픽테토스",emoji:"⛓️",color:"#e5e5e5",tag:"스토아",summary:"통제할 수 있는 것과 없는 것을 구분하라. 사건이 아니라 사건에 대한 판단이 우리를 괴롭힌다.",style:"단호하지만 담백한 어조, 노예 출신다운 현실적 예시",keys:["불안","통제","눈치","평판","걱정","분노"]},
  seneca:{name:"세네카",emoji:"🖋️",color:"#e8dfd3",tag:"스토아",summary:"시간은 가장 귀한 재산. 우리는 실제보다 상상 속에서 더 많이 괴로워한다.",style:"편지처럼 다정한 어조, '루킬리우스에게 쓰듯' 조언, 시간·하루 단위 실천",keys:["번아웃","시간","걱정","바쁨","미래","불안"]},
  nietzsche:{name:"니체",emoji:"⚡",color:"#f3d6d6",tag:"실존",summary:"타인의 잣대가 아닌 나만의 가치를 창조하라. 너 자신이 되어라. 운명을 사랑하라.",style:"강렬하고 선언적인 어조, 낙타·사자·아이 비유, 짧은 아포리즘",keys:["자존감","비교","눈치","실패","열등감","진로"]},
  camus:{name:"카뮈·사르트르",emoji:"🪨",color:"#d9e9d2",tag:"실존",summary:"세상은 부조리하지만 의미는 내가 선택해 만든다. 시지프는 행복하다고 상상해야 한다.",style:"담담하고 솔직한 어조, 시지프의 바위·카페 웨이터 예시, 선택과 책임 강조",keys:["의미","진로","결정","허무","불확실","번아웃"]},
  freud:{name:"프로이트",emoji:"🛋️",color:"#e6d8cc",tag:"정신분석",summary:"마음의 대부분은 의식 아래 무의식에 있다. 반복되는 감정과 행동 뒤에는 억압된 욕망·어린 시절의 경험·방어기제가 숨어 있고, 그것을 말로 꺼내 이해할 때 증상은 힘을 잃는다.",style:"차분하고 분석적인 의사의 어조, 시가를 든 노신사처럼 '흥미롭군요' 하며 꿈·말실수·반복되는 패턴을 짚고 되묻는 화법",keys:["꿈","불안","연애","부모","가족","반복","죄책감","분노","트라우마"]}
};
const WORKS={laozi:"『도덕경』",confucius:"『논어』, 『중용』, 『대학』",buddha:"초기 경전(『법구경』, 『숫타니파타』, 아함경·니까야), 사성제·팔정도·연기",zhuangzi:"『장자』 내편(소요유, 제물론, 양생주 등)과 외·잡편",socrates:"플라톤의 대화편(『변론』, 『크리톤』, 『파이돈』, 『국가』 등)과 크세노폰의 기록",epictetus:"『엥케이리디온』, 『담화록』 (그리고 스토아 동료 세네카의 『루킬리우스에게 보내는 편지』)",seneca:"『루킬리우스에게 보내는 편지』, 『인생의 짧음에 관하여』, 『화에 관하여』, 『마음의 평정에 관하여』",nietzsche:"『차라투스트라는 이렇게 말했다』, 『즐거운 학문』, 『선악의 저편』, 『도덕의 계보』, 『우상의 황혼』",camus:"카뮈의 『시지프 신화』, 『이방인』, 『페스트』, 『반항하는 인간』과 사르트르의 『실존주의는 휴머니즘이다』, 『존재와 무』, 『닫힌 방』",freud:"『꿈의 해석』, 『일상생활의 정신병리학』, 『정신분석 강의』, 『쾌락원칙을 넘어서』, 『자아와 이드』, 『애도와 멜랑콜리』, 『문명 속의 불만』"};
const IDS = Object.keys(SAGES);
/* 워너비 코치: 실존 방송인을 흉내 내지 않고, 공개된 방송 스타일을 분석해 코칭 */
const COACHES={

  const scored = [...IDS,...Object.keys(COACHES)].map(id=>({id,s:SAGES[id].keys.filter(k=>text.includes(k)).length+Math.random()*0.5}));
  scored.sort((a,b)=>b.s-a.s);
  const n = 2 + Math.floor(Math.random()*3); // 2~4명
  return scored.slice(0,n).map(x=>x.id);
}

// 서버 과부하(429/500/503/529) 시 잠깐 기다렸다 최대 2번 다시 시도
async function fetchRetry(url,opts){
  let r;
  for(let i=0;i<3;i++){
    r=await fetch(url,opts);
    if(![429,500,502,503,529].includes(r.status)) return r;
    if(i<2) await new Promise(res=>setTimeout(res,1500*(i+1)));
  }
  return r;
}
const BUSY=[429,500,502,503,529];
function apiErr(name,status,body){
  const e=new Error(BUSY.includes(status)?`${name} 서버가 지금 붐벼요(${status}). 잠시 후 다시 보내주세요`:status===400||status===401||status===403?`${name} 키나 설정을 확인해 주세요(${status})`:`${name} 오류 ${status}: ${body.slice(0,120)}`);
  e.busy=BUSY.includes(status); return e;
}

- [지금까지 대화]가 있으면 앞서 사용자가 흘린 디테일을 기억해 이어간다.
- [답장 대상 메시지]가 있으면 그 메시지에 대한 답장으로 자연스럽게 이어 말한다.
- 사용자 입력의 [상황/배경]은 상황·감정 설명으로 반영한다.
- 자해·위기 신호가 보이면 캐릭터 말투를 유지하되 주변 사람이나 전문가의 도움을 분명히 권한다.`;
  if(!s.custom) return `너는 ${s.name}이다. 실제 역사 속 ${s.name}의 저작과 기록 — ${WORKS[id]} — 그리고 학계에서 받아들여지는 그의 사상을 근거로, "${s.name}이라면 이 고민에 이렇게 답했을 것이다"라는 가정 아래 답한다.
[핵심 사상] ${s.summary}
[말투] ${s.style}
규칙:
- 반드시 그의 실제 개념·논리·일화에 기반해 답하고, 그가 하지 않았을 주장이나 현대적 상식을 그의 입을 빌려 말하지 않는다.
- 저작 속 구절이나 개념을 자연스럽게 녹이되, 원문 인용은 확실히 알고 있는 경우에만 하고 그 외에는 의역하며 필요하면 책 이름을 짧게 언급한다(예: "『도덕경』에서 말했듯…"). 출처나 인용을 지어내지 않는다.
- 목표는 위로가 아니라 사용자의 성장이다. 사용자의 말에 무조건 맞장구치거나 듣기 좋은 말로 달래지 않는다. ${s.name}이 실제로 했을 법한 직설·쓴소리라면 차갑더라도 그대로 한다.
- 사용자의 전제, 핑계, 자기기만, 회피를 그의 사상에 비추어 짚어낸다. 사용자가 틀렸다고 보이면 분명히 말한다. 공감은 짧게, 필요한 만큼만.
- 막연한 격려 대신 오늘·이번 주에 할 수 있는 현실적이고 구체적인 행동이나 스스로에게 던질 질문 하나를 남긴다.
- 일상적인 비유나 짧은 예시를 하나 넣는다.
- 한국어 카톡 메시지처럼 3~6문장으로 답한다.
- [지금까지 대화]가 주어지면 그 흐름을 이어서, 앞서 사용자가 한 말과 다른 성현들의 말을 기억하고 필요하면 동의·반박·보충한다. 같은 말을 반복하지 않는다.
- 사용자 입력의 [상황/배경]은 상황·감정·배경 설명이니 반영한다.
${others?`이 방은 단톡방이며 이번 차례에 ${others}가 답한다. 앞선 답과 겹치지 않게 너만의 관점으로 말한다.`:""}
- 자해·위기 상황이 보이면 그의 어조를 유지하되 주변 사람이나 전문가의 도움을 분명히 권한다.`;
  if(s.custom) return `너는 지금부터 '${s.name}'라는 캐릭터로서 사용자와 메신저로 대화한다. 절대 AI라고 밝히거나 캐릭터를 벗어나지 않는다.
[서사·배경] ${s.summary}
[성격·말투] ${s.style||"서사에 어울리게"}
[사용자와의 관계] ${s.rel||"서사에 어울리게 자연스럽게"}
[지금까지 대화]가 주어지면 그 장면과 감정선을 그대로 이어서 답한다.
규칙: 한국어 카톡 메시지처럼 1~4문장으로 짧게 답한다. 행동·표정 묘사는 *별표* 안에 짧게 넣을 수 있다. 서사와 성격을 일관되게 유지하고, 이전 대화 내용을 기억해 이어간다. 사용자 입력의 [상황/배경]은 지금 장면이나 사용자 감정에 대한 설명으로 반영한다.`;
  return `너는 ${s.name}이다. 철학: ${s.summary} 말투: ${s.style}.
카카오톡 메시지처럼 한국어로 3~5문장, 짧게 답한다. 일상적인 비유나 짧은 예시를 하나 넣는다.
사용자 입력 중 [상황/배경] 표시된 내용은 사용자의 상황·감정·배경 설명이니 조언에 반영한다.
${others?`이 방은 단톡방이며 다른 성현(${others})도 답한다. 앞선 답과 겹치지 않게 너만의 관점으로 말한다.`:""}
의학·법률 등 위기 상황(자해 등)이 보이면 전문가나 주변 사람의 도움을 권한다.`;
}
function toUserText({main,ctx,replyTo}){return (replyTo?`[답장 대상 메시지] ${replyTo.name}: "${replyTo.text}"\n(사용자는 위 메시지에 대한 답장으로 아래 말을 했다. 그 메시지의 흐름을 이어서 답한다.)\n`:"") + main + (ctx.length?`\n[상황/배경] ${ctx.join(" / ")}`:"");}

async function llmReply(id,parsed,priorReplies,others,before,rm){
  const {provider,apiKey,model}=settings;
  // 이 대화방의 이전 대화를 대본 형태로 전달 → 대화가 이어짐
  const N = SAGES[rm]?.custom ? 30 : GROUPS[rm] ? 24 : 16;
  const lines=(before||[]).filter(m=>!m.text.startsWith("⚠️")).slice(-N).map(m=>{
    const t=m.text.split("\n\n⚠️")[0].split("\n\n(데모 모드")[0];
    return `${m.from==="me"?"나":SAGES[m.from]?.name||"?"}${m.replyTo?` (→ ${m.replyTo.name}의 "${m.replyTo.text.slice(0,40)}"에 답장)`:""}: ${t}`;});
  let user = (lines.length?"[지금까지 대화 (오래된 순)]\n"+lines.join("\n")+"\n\n[이번 메시지]\n":"") + toUserText(parsed);
  if(priorReplies.length) user += "\n\n[이번 메시지에 먼저 답한 성현들]\n"+priorReplies.join("\n");
  const msgs=[{role:"user",content:user}];
  if(provider==="anthropic"){
    const r=await fetchRetry("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:curModel(),max_tokens:600,system:systemPrompt(id,others),messages:msgs})});
    if(!r.ok) throw apiErr("Claude",r.status,await r.text());
    const j=await r.json(); return j.content.map(c=>c.text||"").join("");
  }
  if(provider==="openai"){
    const r=await fetchRetry("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+apiKey},
      body:JSON.stringify({model:curModel(),max_tokens:600,messages:[{role:"system",content:systemPrompt(id,others)},...msgs]})});
    if(!r.ok) throw apiErr("OpenAI",r.status,await r.text());
    const j=await r.json(); return j.choices[0].message.content;
  }
  if(provider==="gemini"){
    const tryModels=[curModel(),...MODELS.gemini.map(x=>x[0]).filter(x=>x!==curModel()&&!/pro/.test(x))];
    let r,m;
    for(m of tryModels){
    const contents=msgs.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]}));
    r=await fetchRetry(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":apiKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt(id,others)}]},contents,generationConfig:{maxOutputTokens:2048},
        // 감정선·로맨스·드라마 대화가 과하게 끊기지 않도록 '높음' 위험만 차단
        safetySettings:["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH","HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT"].map(category=>({category,threshold:"BLOCK_ONLY_HIGH"}))})});
      if(r.ok||!BUSY.includes(r.status)) break; // 붐비면 다음(대체) 모델로
    }
    if(!r.ok) throw apiErr("Gemini",r.status,await r.text());
    const j=await r.json(); const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    if(!t){const why=j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||"";
      throw new Error(/SAFETY|BLOCK|PROHIBITED/i.test(why)?"Gemini 안전 필터에 걸렸어요 ("+why+"). 표현을 조금 바꿔 다시 보내보세요":"Gemini 빈 응답 "+why);}
    return t;
  }
  throw new Error("demo");
}
async function getReply(id,parsed,prior,others,before,rm){
  if(settings.provider==="demo"||!settings.apiKey) return demoReply(id,parsed);
  try{return await llmReply(id,parsed,prior,others,before,rm);}
  catch(e){console.warn(e);return {error:e};}
}

/* ========== 7. 렌더링 ========== */
const $=s=>document.querySelector(s);
const chat=$("#chat");
const now=()=>new Date().toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"});
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function msgEl(m){
  const d=document.createElement("div");
  const q=m.replyTo?`<div class="quote"><b>↩ ${esc(m.replyTo.name)}에게 답장</b>${esc(m.replyTo.text.slice(0,60))}</div>`:"";
  if(m.from==="me"){d.className="row me";d.innerHTML=`<span class="time">${m.time}</span><div class="bubble">${q}${esc(m.text)}</div>`;}
  else{const s=SAGES[m.from]||{name:"(알 수 없음)",emoji:"❔",color:"#ddd",tag:""};d.className="row sage";
    d.innerHTML=`<div class="avatar" style="background:${s.color}" data-id="${m.from}">${av(s)}</div><div class="body"><div class="name">${s.name}<span class="tag">${s.tag}</span></div>${(()=>{const parts=m.text.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!parts.length)parts.push("");return parts.map((t,i)=>`<div style="display:flex;align-items:flex-end;gap:5px;margin-top:${i?4:0}px"><div class="bubble">${esc(t)}</div>${i===parts.length-1?`<span class="time">${m.time}</span>`:""}</div>`).join("");})()}</div>`;if(m.pid)d.classList.add("pending");}
  // 길게 누르기(또는 우클릭) → 답장
  const setR=()=>setReply(m);let lt;d.querySelectorAll(".bubble").forEach(b=>{
  b.addEventListener("touchstart",()=>{lt=setTimeout(setR,450);},{passive:true});
  ["touchend","touchmove","touchcancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(lt),{passive:true}));
  b.addEventListener("contextmenu",e=>{e.preventDefault();setR();});
  b.addEventListener("dblclick",setR);});
  return d;
}
function render(){
  if(!SAGES[room]&&!GROUPS[room]) room="group";
  const G=GROUPS[room],isGroup=!!G;
  $("#roomTitle").innerHTML=(isGroup?G.name:SAGES[room].name)+`<small>${isGroup?G.members().length+1:2}</small>`;
  chat.innerHTML=`<div class="date"><span>${new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}</span></div>`;
  if(!hist().length){
    const greet=isGroup?{...G.greet,time:now()}
      :{from:room,text:SAGES[room].custom?(SAGES[room].greeting||"..."):`${SAGES[room].name}일세. ${SAGES[room].summary}\n무엇이 자네를 괴롭히는가?`,time:now()};
    chat.appendChild(msgEl(greet));
  }
  hist().forEach(m=>chat.appendChild(msgEl(m)));
  document.querySelectorAll("#modebar button").forEach(b=>b.classList.toggle("on",b.dataset.room===room));
  chat.scrollTop=chat.scrollHeight;
}
function renderModebar(){
  $("#modebar").innerHTML=`<button data-room="group">👥 전체 단톡방</button><button data-room="wannabe">✨ 워너비 단톡방</button>`+IDS.map(id=>`<button data-room="${id}">${SAGES[id].img?`<img class="mini" src="${SAGES[id].img}">`:SAGES[id].emoji} ${SAGES[id].name}</button>`).join("")+customs.map(c=>`<button data-room="${c.id}">${c.img?`<img class="mini" src="${c.img}">`:c.emoji} ${esc(c.name)}</button>`).join("")+`<button class="add" data-add="1">＋ 캐릭터</button>`;
}
function showTyping(id){
  const s=SAGES[id],d=document.createElement("div");
  d.className="row sage typing";
  d.innerHTML=`<div class="avatar" style="background:${s.color}">${av(s)}</div><div class="body"><div class="name">${s.name}</div><div class="bubble">•••</div></div>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ========== 8. 전송 ========== */
let busy=false;
let replyTo=null;
function setReply(m){
  if(m.pid) return;
  replyTo={from:m.from,name:m.from==="me"?"나":SAGES[m.from].name,text:m.text.slice(0,200)};
  $("#replyTxt").textContent=`↩ ${replyTo.name}에게 답장: ${replyTo.text}`;$("#replyBar").classList.add("show");$("#input").focus();
  navigator.vibrate&&navigator.vibrate(20);
}
function clearReply(){replyTo=null;$("#replyBar").classList.remove("show");}
async function send(){
  const text=$("#input").value.trim(); if(!text||busy) return;
  busy=true;$("#send").disabled=true;$("#input").value="";
  try{ await sendInner(text); }
  catch(e){console.error(e);alert("전송 중 오류가 났어요: "+e.message);}
  finally{busy=false;$("#send").disabled=false;$("#input").focus();}
}
async function sendInner(text){
  const targetRoom=room,rt=replyTo;clearReply();
  const push=m=>{(histories[targetRoom] ||= []).push(m);save();if(room===targetRoom){chat.appendChild(msgEl(m));chat.scrollTop=chat.scrollHeight;}};
  const before=(histories[targetRoom]||[]).slice();
  push({from:"me",text,time:now(),...(rt?{replyTo:rt}:{})});
  const parsed={...parseInput(text),replyTo:rt};
  const G=GROUPS[targetRoom];
  // 단톡방에서 특정 인물의 말에 답장하면 그 사람이 이어서 답함
  const sages=G?(rt&&rt.from!=="me"&&G.members().includes(rt.from)?[rt.from]:G.pick(text)):[targetRoom];
  const others=G&&sages.length>1?sages.map(i=>SAGES[i].name).join(", "):"";
  const prior=[];
  for(const id of sages){
    await sleep(400);
    const t=room===targetRoom?showTyping(id):null;
    const [reply]=await Promise.all([getReply(id,parsed,prior,others,before,targetRoom),sleep(900+Math.random()*900)]);
    t&&t.remove();
    if(reply&&reply.error){
      if(reply.error.busy){
        const pid="p"+Date.now()+id;
        push({from:id,text:"⚠️ 지금 서버가 붐벼서 5분 뒤에 다시 답할게요…",time:now(),pid});
        addPending({pid,room:targetRoom,id,text,replyTo:rt,beforeLen:before.length,others,due:Date.now()+5*60*1000,tries:0});
      } else push({from:id,text:"⚠️ "+reply.error.message+"\n(오류가 계속되면 ☰ 설정을 확인해 주세요)",time:now()});
      continue;
    }
    prior.push(`${SAGES[id].name}: ${reply}`);
    push({from:id,text:reply,time:now()});
  }
}
/* ===== 붐빔 오류 시 5분 뒤 자동 재답변 (앱을 닫았다 열어도 이어서 처리) ===== */
let pending=JSON.parse(localStorage.getItem("sagetalk_pending")||"[]");
const savePending=()=>localStorage.setItem("sagetalk_pending",JSON.stringify(pending));
function addPending(p){pending.push(p);savePending();}
let pendingBusy=false;
async function processPending(){
  if(pendingBusy) return; pendingBusy=true;
  for(const p of pending.filter(x=>x.due<=Date.now())){
    const h=histories[p.room]||[], m=h.find(x=>x.pid===p.pid);
    if(!m){pending=pending.filter(x=>x!==p);continue;}
    const before=h.slice(0,p.beforeLen).filter(x=>!x.pid);
    const reply=await getReply(p.id,{...parseInput(p.text),replyTo:p.replyTo},[],p.others,before,p.room);
    if(reply&&reply.error){
      if(reply.error.busy&&++p.tries<3){p.due=Date.now()+5*60*1000;m.text=`⚠️ 아직 붐벼요. 5분 뒤 다시 시도할게요… (${p.tries+1}/3)`;}
      else{m.text="⚠️ "+reply.error.message;delete m.pid;pending=pending.filter(x=>x!==p);}
    } else {m.text=reply;m.time=now();delete m.pid;pending=pending.filter(x=>x!==p);}
    save();savePending();if(room===p.room) render();
  }
  pendingBusy=false;
}
setInterval(processPending,20000);

$("#resetChat").onclick=()=>{if(confirm("현재 대화방 내역을 지울까요?")){histories[room]=[];save();render();$("#settingsModal").classList.remove("show");}};
$("#wipeAll").onclick=()=>{if(confirm("모든 대화 내역과 저장된 API 키를 이 브라우저에서 삭제할까요?")){localStorage.removeItem(LS("hist"));localStorage.removeItem(LS("settings"));histories={};settings={provider:"demo",apiKey:"",model:""};room="group";$("#settingsModal").classList.remove("show");render();}};
$("#peopleBtn").onclick=()=>{$("#plist").innerHTML=[...IDS,...Object.keys(COACHES),...customs.map(c=>c.id)].map(id=>{const s=SAGES[id];return `<div data-id="${id}"><span class="avatar" style="background:${s.color}">${av(s)}</span><span><b>${esc(s.name)}</b><span class="badge">${s.tag}</span><p>${esc(s.summary.slice(0,80))}</p></span></div>`}).join("")+`<div data-add="1"><span class="avatar" style="background:#eee">＋</span><span><b>새 캐릭터 만들기</b><p>소설·웹툰 속 캐릭터의 서사와 말투를 입력하면 1:1로 대화할 수 있어요</p></span></div>`;$("#peopleModal").classList.add("show");};
$("#closePeople").onclick=()=>$("#peopleModal").classList.remove("show");
$("#plist").onclick=e=>{if(e.target.closest("[data-add]")){$("#peopleModal").classList.remove("show");return openCharForm();}const d=e.target.closest("[data-id]");if(d){$("#peopleModal").classList.remove("show");if(COACHES[d.dataset.id])return openProfile(d.dataset.id);room=d.dataset.id;render();}};
function setAvatar(id,data){
  try{
    if(SAGES[id].custom){const c=customs.find(x=>x.id===id);c.img=data;saveCustoms();}
    else{if(data)AV[id]=data;else delete AV[id];localStorage.setItem("sagetalk_avatars",JSON.stringify(AV));applyAvatars();}
  }catch(e){return alert("저장 공간이 부족해요. 다른 프사를 정리해 주세요.");}
  $("#profileModal").classList.remove("show");renderModebar();render();openProfile(id);
}
function openProfile(id){const s=SAGES[id];$("#profileCard").innerHTML=`<div class="avatar" style="background:${s.color};width:60px;height:60px;font-size:32px;margin-bottom:10px">${av(s)}</div><h3>${esc(s.name)}<span class="badge">${s.tag}</span></h3><p style="font-size:14px;line-height:1.6;margin:8px 0;white-space:pre-wrap">${esc(s.summary)}</p><p style="font-size:12px;color:#777">말투: ${esc(s.style||"-")}</p><div class="btns"><button class="pri" id="go1">1:1 대화하기</button><button id="closeProf">닫기</button></div>${s.custom?`<div class="btns"><button id="editC">수정</button><button id="delC">삭제</button></div>`:""}`;
  if(s.coach) $("#go1").remove();
  // 모든 인물 프사 변경
  $("#profileCard").insertAdjacentHTML("beforeend",`<div class="btns"><label style="flex:1;margin:0"><span style="display:block;text-align:center;padding:9px;border-radius:8px;background:#eee;cursor:pointer;font-size:14px">프사 변경</span><input type="file" accept="image/*" id="avIn" style="display:none"></label><button id="avDel">기본 프사</button></div>`);
  $("#avIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();
    img.onload=()=>{const n=256,c=document.createElement("canvas");c.width=c.height=n;const k=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n);setAvatar(id,c.toDataURL("image/jpeg",0.85));URL.revokeObjectURL(img.src);};
    img.src=URL.createObjectURL(f);};
  $("#avDel").onclick=()=>setAvatar(id,"");
  if(s.custom){$("#editC").onclick=()=>{$("#profileModal").classList.remove("show");openCharForm(id);};
    $("#delC").onclick=()=>{if(confirm(`${s.name} 캐릭터와 대화 내역을 삭제할까요?`)){customs=customs.filter(c=>c.id!==id);delete histories[id];save();saveCustoms();room="group";$("#profileModal").classList.remove("show");renderModebar();render();}};}$("#profileModal").classList.add("show");
  if($("#go1")) $("#go1").onclick=()=>{room=id;$("#profileModal").classList.remove("show");render();};$("#closeProf").onclick=()=>$("#profileModal").classList.remove("show");}
chat.onclick=e=>{const a=e.target.closest(".avatar[data-id]");if(a) openProfile(a.dataset.id);};
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m) m.classList.remove("show");});

let editingId=null,pendingImg="";
const showPrev=()=>{$("#cPrev").innerHTML=pendingImg?`<img src="${pendingImg}" style="width:100%;height:100%;object-fit:cover">`:($("#cEmoji").value||"👤");};
// 사진을 256px 정사각형으로 잘라 줄여서 저장 (휴대폰 저장공간 절약)
$("#cImg").onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{const n=256,c=document.createElement("canvas");c.width=c.height=n;const k=Math.min(img.width,img.height);
    c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n);pendingImg=c.toDataURL("image/jpeg",0.85);URL.revokeObjectURL(img.src);showPrev();};
  img.src=URL.createObjectURL(f);};
$("#cImgDel").onclick=()=>{pendingImg="";$("#cImg").value="";showPrev();};
$("#cEmoji").oninput=showPrev;
function openCharForm(id){
  editingId=id||null;const c=id?SAGES[id]:{};
  $("#charTitle").textContent=id?"캐릭터 수정":"새 캐릭터 만들기";
  $("#cName").value=c.name||"";$("#cEmoji").value=c.emoji||"";$("#cStory").value=c.summary||"";
  $("#cStyle").value=c.style||"";$("#cRel").value=c.rel||"";$("#cGreet").value=c.greeting||"";
  pendingImg=c.img||"";$("#cImg").value="";showPrev();
  $("#charModal").classList.add("show");
}
$("#cCancel").onclick=()=>$("#charModal").classList.remove("show");
$("#cSave").onclick=()=>{
  const name=$("#cName").value.trim(),story=$("#cStory").value.trim();
  if(!name||!story) return alert("이름과 서사·배경은 꼭 적어주세요.");
  const data={name,emoji:$("#cEmoji").value.trim()||"👤",summary:story,style:$("#cStyle").value.trim(),rel:$("#cRel").value.trim(),greeting:$("#cGreet").value.trim(),img:pendingImg,tag:"캐릭터",custom:true};
  if(editingId){Object.assign(customs.find(c=>c.id===editingId),data);}
  else{editingId="c_"+Date.now();customs.push({id:editingId,color:COLORS[customs.length%COLORS.length],...data});}
  try{saveCustoms();}catch(err){return alert("저장 공간이 부족해요. 사진을 빼거나 다른 캐릭터를 정리해 주세요.");}
  room=editingId;$("#charModal").classList.remove("show");renderModebar();render();
};
const _wipe=$("#wipeAll").onclick;$("#wipeAll").onclick=()=>{_wipe();if(!localStorage.getItem(LS("hist"))){localStorage.removeItem("sagetalk_chars");customs=[];loadCustoms();renderModebar();render();}};
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ===== 입장 비밀번호 (한 번 맞히면 이 기기에서는 다시 묻지 않음) ===== */
const PW_HASH="6062c68c3fdcea26a3170da31ddacc4e380916c0c8b726f8c38144665b84c481";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
if(localStorage.getItem("sagetalk_auth")===PW_HASH) $("#lock").classList.add("hide"); else setTimeout(()=>$("#pw").focus(),100);
async function tryPw(){
  if(await sha("sagetalk:"+$("#pw").value)===PW_HASH){localStorage.setItem("sagetalk_auth",PW_HASH);$("#lock").classList.add("hide");}
  else{$("#lockMsg").textContent="비밀번호가 달라요";$("#pw").value="";}
}
$("#pwBtn").onclick=tryPw;
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryPw();});

renderModebar();render();
setTimeout(processPending,1500);
</script>
</body>
